<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kronos - Gestão Financeira e Marcas</title>
    <!-- Tailwind CSS para um design moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs via CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // AS SUAS CHAVES REAIS DO FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyD6Mv3DiNGWCoC4Rd0iOt6L22qxnS-XAhY",
            authDomain: "kronos-gestao-fincanceira.firebaseapp.com",
            databaseURL: "https://kronos-gestao-fincanceira-default-rtdb.firebaseio.com",
            projectId: "kronos-gestao-fincanceira",
            storageBucket: "kronos-gestao-fincanceira.firebasestorage.app",
            messagingSenderId: "26146570774",
            appId: "1:26146570774:web:0ca1bdf457eae2623eeb37",
            measurementId: "G-B7SWGH8945"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let cicloAtual = 5;

        // Função para carregar cobranças do Firebase
        window.carregarCobrancas = async function(dia) {
            cicloAtual = dia;
            
            // Atualizar visual dos botões
            document.getElementById('btnDia5').className = dia === 5 ? 'px-4 py-2 bg-blue-600 text-white rounded-lg font-medium shadow' : 'px-4 py-2 bg-white text-gray-700 border border-gray-300 rounded-lg font-medium hover:bg-gray-50';
            document.getElementById('btnDia20').className = dia === 20 ? 'px-4 py-2 bg-blue-600 text-white rounded-lg font-medium shadow' : 'px-4 py-2 bg-white text-gray-700 border border-gray-300 rounded-lg font-medium hover:bg-gray-50';

            const tabela = document.getElementById('tabelaCobrancas');
            tabela.innerHTML = `<tr><td colspan="5" class="px-6 py-4 text-center text-gray-500">Carregando dados...</td></tr>`;

            try {
                const q = query(collection(db, "cobrancas"), where("dia_vencimento", "==", dia));
                const querySnapshot = await getDocs(q);

                tabela.innerHTML = '';
                let totalGeral = 0;
                let totalPago = 0;
                let count = 0;

                if (querySnapshot.empty) {
                    tabela.innerHTML = `<tr><td colspan="5" class="px-6 py-4 text-center text-gray-500">Nenhuma cobrança encontrada para o ciclo do dia ${dia}.</td></tr>`;
                    atualizarCards(0, 0, 0);
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    count++;
                    totalGeral += Number(data.valor_total || 0);
                    totalPago += Number(data.valor_pago || 0);

                    const badgeStatus = data.status_pagamento === 'pago' 
                        ? '<span class="px-2.5 py-1 text-xs font-semibold bg-green-100 text-green-800 rounded-full">Pago</span>'
                        : '<span class="px-2.5 py-1 text-xs font-semibold bg-yellow-100 text-yellow-800 rounded-full">Pendente</span>';

                    tabela.innerHTML += `
                        <tr class="hover:bg-gray-50 border-b border-gray-100">
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 font-mono">${data.cliente_id.substring(0, 15)}...</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">Dia ${data.dia_vencimento}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 font-semibold">R$ ${Number(data.valor_total).toFixed(2)}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-green-600 font-semibold">R$ ${Number(data.valor_pago || 0).toFixed(2)}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm">${badgeStatus}</td>
                        </tr>
                    `;
                });

                atualizarCards(totalGeral, totalPago, count);

            } catch (error) {
                console.error("Erro ao carregar dados: ", error);
                tabela.innerHTML = `<tr><td colspan="5" class="px-6 py-4 text-center text-red-500">Erro ao carregar os dados.</td></tr>`;
            }
        }

        function atualizarCards(total, pago, qtd) {
            document.getElementById('totalPrevisto').innerText = `R$ ${total.toFixed(2)}`;
            document.getElementById('totalArrecadado').innerText = `R$ ${pago.toFixed(2)}`;
            document.getElementById('totalClientes').innerText = qtd;
        }

        window.onload = () => {
            carregarCobrancas(5);
        };
    </script>
</head>
<body class="bg-gray-50 min-h-screen">

    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 py-5 flex justify-between items-center">
            <h1 class="text-2xl font-bold text-gray-800">Kronos</h1>
            <span class="text-sm font-medium bg-blue-100 text-blue-800 px-3 py-1 rounded-full">Painel Conectado</span>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 border-l-4 border-l-blue-500">
                <p class="text-sm font-medium text-gray-500 uppercase tracking-wide">Previsto (Ciclo)</p>
                <p id="totalPrevisto" class="text-3xl font-bold text-gray-900 mt-2">R$ 0,00</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 border-l-4 border-l-green-500">
                <p class="text-sm font-medium text-gray-500 uppercase tracking-wide">Arrecadado</p>
                <p id="totalArrecadado" class="text-3xl font-bold text-green-600 mt-2">R$ 0,00</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 border-l-4 border-l-purple-500">
                <p class="text-sm font-medium text-gray-500 uppercase tracking-wide">Registros</p>
                <p id="totalClientes" class="text-3xl font-bold text-gray-900 mt-2">0</p>
            </div>
        </div>

        <div class="bg-white p-6 rounded-t-xl shadow-sm border border-gray-200 border-b-0">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
                <h2 class="text-lg font-semibold text-gray-800">Faturamento por Vencimento</h2>
                <div class="flex gap-2">
                    <button id="btnDia5" onclick="carregarCobrancas(5)" class="px-4 py-2 bg-blue-600 text-white rounded-lg font-medium shadow transition-colors">Ciclo Dia 5</button>
                    <button id="btnDia20" onclick="carregarCobrancas(20)" class="px-4 py-2 bg-white text-gray-700 border border-gray-300 rounded-lg font-medium hover:bg-gray-50 transition-colors">Ciclo Dia 20</button>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-b-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">ID Cliente</th>
                            <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Vencimento</th>
                            <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Valor Total</th>
                            <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Valor Pago</th>
                            <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Status</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaCobrancas" class="bg-white divide-y divide-gray-200">
                        <!-- Dados injetados aqui -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

</body>
</html>
