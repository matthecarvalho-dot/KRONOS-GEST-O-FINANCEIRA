<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kronos - Gestão Financeira e Marcas</title>
    <!-- Tailwind CSS para um design moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // SUA CONFIGURAÇÃO DO FIREBASE (Substitua pelos dados do seu projeto)
        const firebaseConfig = {
            apiKey: "SUA_API_KEY_AQUI",
            authDomain: "kronos-gestao-financeira.firebaseapp.com",
            projectId: "kronos-gestao-financeira",
            storageBucket: "kronos-gestao-financeira.appspot.com",
            messagingSenderId: "SEU_MESSAGING_SENDER_ID",
            appId: "SEU_APP_ID"
        };

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let cicloAtual = 5; // Padrão inicial

        // Função para carregar cobranças do Firebase
        window.carregarCobrancas = async function(dia) {
            cicloAtual = dia;
            
            // Atualizar classes visuais dos botões de ciclo
            document.getElementById('btnDia5').className = dia === 5 ? 'px-4 py-2 bg-blue-600 text-white rounded-lg font-medium shadow' : 'px-4 py-2 bg-white text-gray-700 border border-gray-300 rounded-lg font-medium hover:bg-gray-50';
            document.getElementById('btnDia20').className = dia === 20 ? 'px-4 py-2 bg-blue-600 text-white rounded-lg font-medium shadow' : 'px-4 py-2 bg-white text-gray-700 border border-gray-300 rounded-lg font-medium hover:bg-gray-50';

            const tabela = document.getElementById('tabelaCobrancas');
            tabela.innerHTML = `<tr><td colspan="5" class="px-6 py-4 text-center text-gray-500">Carregando dados...</td></tr>`;

            try {
                // Consulta no Firestore filtrando por dia_vencimento
                const q = query(collection(db, "cobrancas"), where("dia_vencimento", "==", dia));
                const querySnapshot = await getDocs(q);

                tabela.innerHTML = '';
                let totalGeral = 0;
                let totalPago = 0;
                let count = 0;

                if (querySnapshot.empty) {
                    tabela.innerHTML = `<tr><td colspan="5" class="px-6 py-4 text-center text-gray-500">Nenhuma cobrança encontrada para o ciclo do dia ${dia}.</td></tr>`;
                    atualizarCards(0, 0, 0);
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    count++;
                    totalGeral += Number(data.valor_total || 0);
                    totalPago += Number(data.valor_pago || 0);

                    const badgeStatus = data.status_pagamento === 'pago' 
                        ? '<span class="px-2.5 py-1 text-xs font-semibold bg-green-100 text-green-800 rounded-full">Pago</span>'
                        : '<span class="px-2.5 py-1 text-xs font-semibold bg-yellow-100 text-yellow-800 rounded-full">Pendente</span>';

                    tabela.innerHTML += `
                        <tr class="hover:bg-gray-50">
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 font-mono">${data.cliente_id.substring(0, 10)}...</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">Dia ${data.dia_vencimento}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900 font-semibold">R$ ${Number(data.valor_total).toFixed(2)}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-green-600 font-semibold">R$ ${Number(data.valor_pago || 0).toFixed(2)}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm">${badgeStatus}</td>
                        </tr>
                    `;
                });

                atualizarCards(totalGeral, totalPago, count);

            } catch (error) {
                console.error("Erro ao carregar dados: ", error);
                tabela.innerHTML = `<tr><td colspan="5" class="px-6 py-4 text-center text-red-500">Erro ao carregar os dados do Firebase. Verifique a configuração.</td></tr>`;
            }
        }

        function atualizarCards(total, pago, qtd) {
            document.getElementById('totalPrevisto').innerText = `R$ ${total.toFixed(2)}`;
            document.getElementById('totalArrecadado').innerText = `R$ ${pago.toFixed(2)}`;
            document.getElementById('totalClientes').innerText = qtd;
        }

        // Carregar o ciclo do dia 5 automaticamente ao abrir a página
        window.onload = () => {
            carregarCobrancas(5);
        };
    </script>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Barra Superior -->
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-gray-800">Kronos — Gestão Financeira e Marcas</h1>
            <span class="text-sm text-gray-500">Ambiente Integrado Firebase</span>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- Cards de Resumo Automático -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <p class="text-sm font-medium text-gray-500">Total Previsto (Ciclo)</p>
                <p id="totalPrevisto" class="text-2xl font-bold text-gray-900 mt-2">R$ 0,00</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <p class="text-sm font-medium text-gray-500">Total Arrecadado (Pago)</p>
                <p id="totalArrecadado" class="text-2xl font-bold text-green-600 mt-2">R$ 0,00</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <p class="text-sm font-medium text-gray-500">Registros no Ciclo</p>
                <p id="totalClientes" class="text-2xl font-bold text-blue-600 mt-2">0</p>
            </div>
        </div>

        <!-- Seletor de Ciclos (Dias 5 e 20) -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 mb-6">
            <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
                <h2 class="text-lg font-semibold text-gray-800">Faturamento por Ciclo de Vencimento</h2>
                <div class="flex gap-3">
                    <button id="btnDia5" onclick="carregarCobrancas(5)" class="px-4 py-2 bg-blue-600 text-white rounded-lg font-medium shadow">Ciclo Dia 5</button>
                    <button id="btnDia20" onclick="carregarCobrancas(20)" class="px-4 py-2 bg-white text-gray-700 border border-gray-300 rounded-lg font-medium hover:bg-gray-50">Ciclo Dia 20</button>
                </div>
            </div>
        </div>

        <!-- Tabela de Dados -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID Cliente</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Vencimento</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Valor Total</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Valor Pago</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaCobrancas" class="bg-white divide-y divide-gray-200">
                        <!-- Os dados do Firebase entram aqui dinamicamente -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

</body>
</html>
